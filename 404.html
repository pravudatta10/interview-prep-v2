<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Interview Prep</title>
</head>
<body>
<script>
  /*
   * Why this file exists
   * ---------------------
   * This app is a client-side-routed SPA: "/learn", "/coding/java-basics/loops",
   * etc. only ever exist as real, requestable URLs in the browser's address
   * bar — there's no matching file or directory for them on disk. Normal
   * in-app navigation never touches the network for these (history.pushState
   * only), but a refresh, a typed URL, or a bookmark makes the browser issue
   * a real HTTP request for that exact path.
   *
   * A plain static file server (or a host with no configured rewrite rule)
   * has nothing to serve for that request and returns a 404. On hosts that
   * support a custom 404 page — GitHub Pages included — that 404 response
   * is THIS file's content. Instead of leaving the visitor on a dead error
   * page, stash the path they actually wanted and hand off to the real app
   * shell, which restores it (see the matching script in index.html) before
   * the router boots.
   *
   * This does not require any server configuration — it works purely
   * because the server already serves a 404 page. Where possible, prefer a
   * proper rewrite rule instead (see README.md "Deep Links / Refresh" for
   * the Netlify/Vercel/Apache/nginx options shipped alongside this file) —
   * this page is the fallback for hosts where that isn't available.
   */
  sessionStorage.setItem('ip:redirectPath', location.pathname + location.search + location.hash);
  location.replace('./index.html');
</script>
</body>
</html>
