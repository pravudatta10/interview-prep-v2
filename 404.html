<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#0f172a" />
<title>Interview Prep</title>
<link rel="stylesheet" href="./src/styles/variables.css" />
<link rel="stylesheet" href="./src/styles/layout.css" />
<link rel="stylesheet" href="./src/styles/components.css" />
<link rel="stylesheet" href="./src/styles/utilities.css" />
<link rel="stylesheet" href="./src/styles/mobile.css" />
</head>
<body>
  <script>
    const currentPath = window.location.pathname + window.location.search + window.location.hash;
    const segments = currentPath.split('/').filter(Boolean);
    const repoSegment = segments[0] && !segments[0].includes('.') ? segments[0] : '';
    const route = repoSegment ? currentPath.replace(new RegExp(`^/${repoSegment}`), '') || '/' : currentPath;
    window.location.replace(`./index.html?route=${encodeURIComponent(route)}`);
  </script>
</body>
</html>
